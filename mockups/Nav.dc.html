<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="planer.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Hauptnavigation" style="width: 100%; min-height: 900px; height: 100%; box-sizing: border-box; padding: 24px 16px; background: #FFFFFF; border-right: 1px solid #E1E5E0; display: flex; flex-direction: column; gap: 4px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B2421;">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 12px 24px;">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#2F6B4F"></rect><path d="M8 18h12M10 18v-4a4 4 0 0 1 8 0v4M14 10V8" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
    <div style="font-weight: 600; font-size: 15px; line-height: 1.2;">Produktionsplaner<div style="font-weight: 400; font-size: 12px; color: #5B6661;">GAMMA Catering</div></div>
  </div>
  <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
    <a href="{{it.href}}" aria-current="{{it.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; {{it.style}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}
    </a>
  </sc-for>
  <div style="height: 1px; background: #EEF0EC; margin: 12px 12px;"></div>
  <sc-for list="{{later}}" as="it" hint-placeholder-count="2">
    <span style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; font-size: 14px; color: #8A938F;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}<span style="margin-left: auto; font-size: 11px;">später</span>
    </span>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["leitstand","anlass","ressourcen","produktion","rezepte","rentabilitaet"],"default":"leitstand"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'leitstand';
    var items = [
      { key: 'leitstand', label: 'Leitstand', href: 'Main.dc.html', icon: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z' },
      { key: 'anlass', label: 'Anlässe', href: 'Anlass.dc.html', icon: 'M4 5h16v15H4zM4 10h16M9 3v4M15 3v4' },
      { key: 'ressourcen', label: 'Ressourcen', href: 'Ressourcen.dc.html', icon: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { key: 'produktion', label: 'Produktionsplan', href: 'Produktion.dc.html', icon: 'M4 6h9M4 12h14M4 18h7' },
      { key: 'rezepte', label: 'Rezepte', href: 'Rezepte.dc.html', icon: 'M6 4h10l2 2v14H6zM9 9h6M9 13h6M9 17h4' },
      { key: 'rentabilitaet', label: 'Rentabilität', href: 'Rentabilitaet.dc.html', icon: 'M4 19l5-6 4 3 7-9M15 7h5v5' }
    ];
    return {
      items: items.map(function (it) {
        var on = it.key === active;
        return { label: it.label, href: it.href, icon: it.icon, current: on ? 'page' : 'false',
          style: on ? 'background:#E3EEE7;color:#1F4A36;font-weight:600;' : 'color:#3C4743;' };
      }),
      later: [
        { label: 'Einkauf', icon: 'M5 7h14l-1.5 10h-11zM9 7V5h6v2' },
        { label: 'Stammdaten', icon: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M12 3v3M12 18v3M3 12h3M18 12h3' }
      ]
    };
  }
}
</script>
</body>
</html>
